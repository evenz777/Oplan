<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oplan - Photo Gallery</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      color: #333;
    }
    header {
      background: #222;
      color: #fff;
      padding: 1rem;
      text-align: center;
    }
    .carousel {
      position: relative;
      overflow: hidden;
      width: 100%;
      max-width: 900px;
      margin: 2rem auto;
      border-radius: 10px;
    }
    .slides {
      display: flex;
      transition: transform 0.5s ease-in-out;
    }
    .slides img {
      width: 100%;
      flex-shrink: 0;
    }
    .gallery {
      max-width: 1000px;
      margin: 2rem auto;
      padding: 1rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }
    .gallery img {
      width: 100%;
      border-radius: 8px;
      object-fit: cover;
    }
    .video-section {
      max-width: 900px;
      margin: 2rem auto;
      padding: 1rem;
      text-align: center;
    }
    video {
      width: 100%;
      border-radius: 10px;
    }
    @media (max-width: 768px) {
      .carousel, .gallery, .video-section {
        width: 90%;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Oplan - My Photo Collection</h1>
  </header>

  <div class="carousel" id="carousel">
    <div class="slides" id="slides">
      <img src="photo1.jpeg" alt="Photo 1">
      <img src="photo2.jpeg" alt="Photo 2">
      <img src="photo3.jpeg" alt="Photo 3">
    </div>
  </div>

  <section class="video-section">
    <video autoplay loop muted playsinline>
      <source src="video.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </section>

  <section class="gallery">
    <img src="001.jpeg" alt="Special Moment 1">
    <img src="002.jpeg" alt="Special Moment 2">
    <img src="003.jpeg" alt="Special Moment 3">
    <img src="004.jpeg" alt="Special Moment 4">
  </section>

  <script>
    const slides = document.getElementById('slides');
    const totalSlides = slides.children.length;
    let index = 0;

    function showNextSlide() {
      index = (index + 1) % totalSlides;
      slides.style.transform = `translateX(-${index * 100}%)`;
    }

    setInterval(showNextSlide, 3000);
  </script>
</body>
</html>
